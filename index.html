<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto Piano 🎹</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #312e81);
            color: white;
            padding: 20px;
        }

        .app {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .box {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
        }

        select {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 12px 18px;
            margin: 12px 5px 0 0;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #status {
            text-align: center;
            font-size: 20px;
        }

        #currentNote {
            text-align: center;
            font-size: 50px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* PIANO */

        #piano {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 20px 5px;
        }

        .key {
            width: 60px;
            height: 220px;
            background: white;
            color: black;
            border: 1px solid #555;
            border-radius: 0 0 8px 8px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .key.active {
            background: #818cf8;
            transform: translateY(5px);
        }

        @media(max-width:700px) {

            .key {
                width: 48px;
                height: 190px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🎹 Auto Piano</h1>

    <p class="subtitle">
        Piano tự động đánh bài
    </p>
<div class="box">

    <h2>🔗 Chọn bài từ YouTube</h2>

    <input
        id="youtubeUrl"
        type="text"
        placeholder="Dán link YouTube vào đây..."
        style="
            width:100%;
            padding:13px;
            border-radius:10px;
            border:none;
            background:#111827;
            color:white;
            font-size:16px;
        "
    >

    <button id="youtubeBtn">
        🔎 Nhận bài
    </button>

    <div
        id="youtubeResult"
        style="
            margin-top:15px;
            color:#cbd5e1;
        "
    >
        Chưa chọn bài YouTube.
    </div>

</div>
    <div class="box">

        <h2>🎵 Chọn bài</h2>

        <select id="songSelect">

            <option value="twinkle">
                Twinkle Twinkle Little Star
            </option>

            <option value="ode">
                Ode to Joy
            </option>

            <option value="happy">
                Happy Birthday
            </option>

        </select>

        <br>

        <button id="loadBtn">
            📥 Tải bài
        </button>

        <button id="playBtn">
            ▶️ Play
        </button>

        <button id="pauseBtn">
            ⏸️ Pause
        </button>

        <button id="stopBtn">
            ⏹️ Stop
        </button>

    </div>

    <div class="box">

        <div id="status">
            Sẵn sàng 🎹
        </div>

        <div id="currentNote">
            —
        </div>

    </div>

    <div class="box">

        <h2>🎹 Piano</h2>

        <div id="piano">

            <div class="key" data-note="C4">C</div>
            <div class="key" data-note="D4">D</div>
            <div class="key" data-note="E4">E</div>
            <div class="key" data-note="F4">F</div>
            <div class="key" data-note="G4">G</div>
            <div class="key" data-note="A4">A</div>
            <div class="key" data-note="B4">B</div>

            <div class="key" data-note="C5">C</div>
            <div class="key" data-note="D5">D</div>
            <div class="key" data-note="E5">E</div>

        </div>

    </div>

</div>

<script>

let audioContext = null;

let currentSong = [];
let currentIndex = 0;
let playing = false;
let paused = false;
let timer = null;


/* ==============================
   AUDIO
============================== */

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}


/* ==============================
   TẦN SỐ
============================== */

const frequencies = {

    C4: 261.63,
    D4: 293.66,
    E4: 329.63,
    F4: 349.23,
    G4: 392.00,
    A4: 440.00,
    B4: 493.88,

    C5: 523.25,
    D5: 587.33,
    E5: 659.25

};


/* ==============================
   PHÁT NỐT
============================== */

function playNote(note, duration = 0.5) {

    const frequency =
        frequencies[note];

    if (!frequency) return;

    const ctx =
        getAudioContext();

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type = "triangle";

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.35,
        ctx.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + duration
    );


    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime +
        duration +
        0.05
    );


    highlightKey(note);
}


/* ==============================
   SÁNG PHÍM
============================== */

function highlightKey(note) {

    const key =
        document.querySelector(
            `.key[data-note="${note}"]`
        );

    if (!key) return;

    key.classList.add("active");

    setTimeout(() => {

        key.classList.remove("active");

    }, 180);

}


/* ==============================
   CLICK PIANO
============================== */

document.querySelectorAll(".key")
.forEach(key => {

    key.addEventListener(
        "click",
        () => {

            playNote(
                key.dataset.note
            );

        }
    );

});


/* ==============================
   BÀN PHÍM MÁY TÍNH
============================== */

const keyboard = {

    a: "C4",
    s: "D4",
    d: "E4",
    f: "F4",
    g: "G4",
    h: "A4",
    j: "B4",
    k: "C5",
    l: "D5",
    ";": "E5"

};


document.addEventListener(
    "keydown",
    event => {

        if (event.repeat) return;

        const note =
            keyboard[
                event.key.toLowerCase()
            ];

        if (note) {

            playNote(note);

        }

    }
);


/* ==============================
   DỮ LIỆU BÀI HÁT
============================== */

const songs = {

    twinkle: [
        ["C4", 0.5],
        ["C4", 0.5],
        ["G4", 0.5],
        ["G4", 0.5],
        ["A4", 0.5],
        ["A4", 0.5],
        ["G4", 1],

        ["F4", 0.5],
        ["F4", 0.5],
        ["E4", 0.5],
        ["E4", 0.5],
        ["D4", 0.5],
        ["D4", 0.5],
        ["C4", 1]
    ],

    ode: [
        ["E4", 0.5],
        ["E4", 0.5],
        ["F4", 0.5],
        ["G4", 0.5],

        ["G4", 0.5],
        ["F4", 0.5],
        ["E4", 0.5],
        ["D4", 0.5],

        ["C4", 0.5],
        ["C4", 0.5],
        ["D4", 0.5],
        ["E4", 0.5],

        ["E4", 0.75],
        ["D4", 0.25],
        ["D4", 1]
    ],

    happy: [
        ["C4", 0.4],
        ["C4", 0.4],
        ["D4", 0.8],
        ["C4", 0.8],
        ["F4", 0.8],
        ["E4", 1],

        ["C4", 0.4],
        ["C4", 0.4],
        ["D4", 0.8],
        ["C4", 0.8],
        ["G4", 0.8],
        ["F4", 1]
    ]

};


/* ==============================
   TẢI BÀI
============================== */

document.getElementById("loadBtn")
.addEventListener(
    "click",
    () => {

        const selected =
            document.getElementById(
                "songSelect"
            ).value;

        currentSong =
            songs[selected];

        currentIndex = 0;
        playing = false;
        paused = false;

        clearTimeout(timer);

        document.getElementById(
            "status"
        ).textContent =
            "Đã tải bài 🎵";

        document.getElementById(
            "currentNote"
        ).textContent =
            "Sẵn sàng";

    }
);


/* ==============================
   PLAY
============================== */

document.getElementById("playBtn")
.addEventListener(
    "click",
    () => {

        if (!currentSong.length) {

            const selected =
                document.getElementById(
                    "songSelect"
                ).value;

            currentSong =
                songs[selected];

        }

        clearTimeout(timer);

        currentIndex = 0;

        playing = true;
        paused = false;

        document.getElementById(
            "status"
        ).textContent =
            "🎹 Đang tự động đánh...";

        playNext();

    }
);


/* ==============================
   ĐÁNH NỐT TIẾP THEO
============================== */

function playNext() {

    if (!playing || paused) {
        return;
    }


    if (
        currentIndex >=
        currentSong.length
    ) {

        playing = false;

        document.getElementById(
            "status"
        ).textContent =
            "✅ Đã đánh xong bài!";

        document.getElementById(
            "currentNote"
        ).textContent =
            "🎵";

        return;

    }


    const [note, duration] =
        currentSong[currentIndex];


    document.getElementById(
        "currentNote"
    ).textContent =
        note;


    playNote(
        note,
        duration
    );


    currentIndex++;


    timer = setTimeout(
        playNext,
        duration * 1000
    );

}


/* ==============================
   PAUSE
============================== */

document.getElementById("pauseBtn")
.addEventListener(
    "click",
    () => {

        if (!playing) return;

        paused = true;

        clearTimeout(timer);

        document.getElementById(
            "status"
        ).textContent =
            "⏸️ Đã tạm dừng";

    }
);


/* ==============================
   STOP
============================== */

document.getElementById("stopBtn")
.addEventListener(
    "click",
    () => {

        playing = false;
        paused = false;

        clearTimeout(timer);

        currentIndex = 0;

        document.getElementById(
            "status"
        ).textContent =
            "⏹️ Đã dừng";

        document.getElementById(
            "currentNote"
        ).textContent =
            "—";

    }
);
/* ==============================
   YOUTUBE
============================== */

const youtubeBtn =
    document.getElementById("youtubeBtn");

const youtubeUrl =
    document.getElementById("youtubeUrl");

const youtubeResult =
    document.getElementById("youtubeResult");

async function testPianoAPI() {

    try {

        const response =
            await fetch("/api/piano");

        const data =
            await response.json();

        console.log(
            "Piano API:",
            data
        );

    } catch (error) {

        console.error(
            "Không kết nối được API:",
            error
        );

    }

}
youtubeBtn.addEventListener(
    "click",
    async () => {

        const url =
            youtubeUrl.value.trim();

        if (!url) {

            youtubeResult.textContent =
                "❌ Hãy dán link YouTube.";

            return;
        }

        try {

            const api =
                "https://www.youtube.com/oembed" +
                "?url=" +
                encodeURIComponent(url) +
                "&format=json";

            const response =
                await fetch(api);

            if (!response.ok) {
                throw new Error();
            }

            const data =
                await response.json();

            youtubeResult.innerHTML = `
                ✅ Đã nhận bài!<br><br>

                🎵 <b>${escapeHTML(data.title)}</b><br>

                👤 Kênh:
                ${escapeHTML(data.author_name)}
            `;
const apiResponse = await fetch("/api/piano", {
    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

  body: JSON.stringify({
    title: document.getElementById("songSelect")?.value || "Twinkle Twinkle Little Star"
})
});

const apiData = await apiResponse.json();

if (!apiResponse.ok || !apiData.success) {
    throw new Error(
        apiData.error || "API lỗi"
    );
}

youtubeResult.innerHTML += `
    <br>
    ✅ API đã nhận bài thành công!
`;
        } catch (error) {

            youtubeResult.textContent =
                "❌ Link YouTube không hợp lệ " +
                "hoặc không thể lấy thông tin bài.";

        }

    }
);


/* ==============================
   CHỐNG HTML LẠ
============================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}
function playSong() {

    if (!window.songNotes || !Array.isArray(window.songNotes)) {
        alert("Hãy bấm 🎵 Nhận bài trước!");
        return;
    }

    const ctx = getAudioContext();

    if (ctx.state === "suspended") {
        ctx.resume();
    }

    currentSong = window.songNotes.map(item => {
        return [
            item.note,
            Number(item.duration) || 0.5
        ];
    });

    console.log("🎹 Bài chuẩn bị đánh:", currentSong);

    currentIndex = 0;
    playing = true;
    paused = false;

    document.getElementById("status").textContent =
        "🎹 Đang tự động đánh bài từ API...";

    playNext();
}
   async function receiveSong() {

    try {

        const response = await fetch("/api/piano", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
    title: document.getElementById("songSelect")?.value || "twinkle"
})
        });

        const data = await response.json();

        console.log("API trả về:", data);

        if (!response.ok || !data.success) {
            alert("❌ API lỗi: " + (data.error || "Không lấy được bài"));
            return;
        }

        const notes = data.notes;

        if (!Array.isArray(notes) || notes.length === 0) {
            alert("❌ API không có notes!");
            return;
        }

        window.songNotes = notes;

        alert(`✅ Đã nhận ${notes.length} nốt 🎹`);

        document.getElementById("status").textContent =
            `Đã nhận bài: ${data.title} 🎵`;

    } catch (error) {

        console.error("Lỗi:", error);

        alert("❌ Không kết nối được Piano API!");

    }
}
</script>
<button onclick="receiveSong()">🎵 Nhận bài</button>
<button onclick="playSong()">▶️ Play</button>
</body>
</body>
</html>
