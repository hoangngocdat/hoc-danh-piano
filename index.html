<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🎹 Piano Trainer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#312e81);
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.app{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:40px;
    margin:10px 0 5px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:25px;
}

.box{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

select{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    margin:10px 6px 0 0;
    background:#6366f1;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
}

.info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:15px;
}

.info-card{
    background:rgba(0,0,0,.2);
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.big{
    font-size:32px;
    font-weight:bold;
    margin-top:5px;
}

#guide{
    line-height:1.7;
    color:#dbeafe;
}

#nextNote{
    text-align:center;
    font-size:55px;
    font-weight:bold;
    margin:10px;
}

#message{
    text-align:center;
    min-height:28px;
    font-size:18px;
}

.piano-wrap{
    overflow-x:auto;
    padding:20px 0;
}

.piano{
    display:flex;
    min-width:1000px;
    justify-content:center;
}

.key{
    position:relative;
    flex:1;
    min-width:45px;
    height:230px;
    background:#fff;
    color:#111;
    border:1px solid #555;
    border-radius:0 0 8px 8px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:15px;
    cursor:pointer;
    user-select:none;
    transition:.08s;
}

.key:hover{
    background:#e2e8f0;
}

.key.active{
    background:#818cf8;
    transform:translateY(5px);
}

.key.target{
    box-shadow:inset 0 -12px 0 #22c55e;
}

.key.black{
    background:#111;
    color:white;
    height:145px;
    min-width:34px;
    margin:0 -17px;
    z-index:5;
    border-radius:0 0 6px 6px;
}

.key.black.active{
    background:#6366f1;
}

.key span{
    pointer-events:none;
}

.key .note{
    font-size:13px;
}

.key .computer{
    font-size:15px;
    margin-top:5px;
}

.steps{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.step{
    padding:8px 11px;
    border-radius:8px;
    background:#1e293b;
}

.step.current{
    background:#22c55e;
    color:#052e16;
    font-weight:bold;
}

.step.done{
    opacity:.5;
}

@media(max-width:700px){
    .info{
        grid-template-columns:repeat(2,1fr);
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

Tự học piano bằng bàn phím máy tính

/* =====================================================
   TẠO SELECT
===================================================== */

const songSelect =
    document.getElementById("songSelect");

songs.forEach((song,index)=>{

    const option =
        document.createElement("option");

    option.value=index;

    option.textContent =
        song.name;

    songSelect.appendChild(option);

});


/* =====================================================
   TẠO PIANO
===================================================== */

const piano =
    document.getElementById("piano");


keyboard.forEach((key,index)=>{

    const div =
        document.createElement("div");

    div.className="key";

    div.dataset.note=
        notes[index];

    div.dataset.key=
        key;

    div.innerHTML=`
        <span>
            <div class="note">
                ${notes[index]}
            </div>
            <div class="computer">
                ${key.toUpperCase()}
            </div>
        </span>
    `;

    div.addEventListener(
        "click",
        ()=>{
            pressNote(notes[index]);
        }
    );

    piano.appendChild(div);

});


/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;


function getAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }

    return audioContext;
}


function playNote(note,duration=.45){

    const freq=
        frequencies[note];

    if(!freq) return;

    const ctx=getAudio();

    const osc=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    osc.type="triangle";

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .3,
        ctx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime+
        duration+
        .05
    );

    flashKey(note);
}


/* =====================================================
   FLASH PHÍM
===================================================== */

function flashKey(note){

    const key=
        document.querySelector(
            `.key[data-note="${note}"]`
        );

    if(!key)return;

    key.classList.add("active");

    setTimeout(()=>{
        key.classList.remove("active");
    },160);
}


/* =====================================================
   TRẠNG THÁI
===================================================== */

let currentSong=null;

let currentIndex=0;

let training=false;

let correct=0;

let wrong=0;

let demoTimer=null;


/* =====================================================
   HIỂN THỊ BÀI
===================================================== */

function loadSong(){

    const index=
        Number(songSelect.value);

    currentSong=
        songs[index];

    currentIndex=0;

    correct=0;

    wrong=0;

    updateStats();

    showGuide();

    showTarget();

}


function showGuide(){

    if(!currentSong)return;

    document.getElementById(
        "guide"
    ).innerHTML=`

        <b>${currentSong.name}</b><br>

        Độ khó:
        ${currentSong.difficulty}<br>

        ${currentSong.guide}<br><br>

        <b>⌨️ Cách chơi:</b><br>

        Bấm phím trên máy tính tương ứng
        với nốt đang sáng màu xanh.
    `;


    const steps=
        document.getElementById("steps");

    steps.innerHTML="";


    currentSong.notes.forEach(
        (note,index)=>{

            const div=
                document.createElement("div");

            div.className="step";

            div.dataset.index=index;

            div.textContent=
                note;

            steps.appendChild(div);

        }
    );

}


function showTarget(){

    document
        .querySelectorAll(".key")
        .forEach(key=>{
            key.classList.remove("target");
        });


    if(
        !currentSong ||
        currentIndex>=
        currentSong.notes.length
    ){

        document.getElementById(
            "nextNote"
        ).textContent="🎉";

        return;

    }


    const note=
        currentSong.notes[currentIndex];


    document.getElementById(
        "nextNote"
    ).textContent=
        `🎯 ${note}`;


    const key=
        document.querySelector(
            `.key[data-note="${note}"]`
        );


    if(key){
        key.classList.add("target");
    }


    document
        .querySelectorAll(".step")
        .forEach(step=>{

            step.classList.remove(
                "current"
            );

            step.classList.remove(
                "done"
            );

        });


    document
        .querySelectorAll(".step")
        .forEach(step=>{

            const i=
                Number(step.dataset.index);

            if(i<currentIndex)
                step.classList.add("done");

            if(i===currentIndex)
                step.classList.add("current");

        });

}


/* =====================================================
   CHẤM ĐIỂM
===================================================== */

function pressNote(note){

    playNote(note);


    if(!training){

        document.getElementById(
            "message"
        ).textContent=
            `🎹 Bạn vừa bấm ${note}`;

        return;

    }


    if(!currentSong)return;


    const target=
        currentSong.notes[currentIndex];


    if(note===target){

        correct++;

        currentIndex++;


        document.getElementById(
            "message"
        ).textContent=
            "✅ Chính xác!";


        if(
            currentIndex>=
            currentSong.notes.length
        ){

            training=false;

            document.getElementById(
                "nextNote"
            ).textContent=
                "🏆 Hoàn thành!";


            document.getElementById(
                "message"
            ).textContent=
                `🎉 Hoàn thành ${currentSong.name}!`;

        }

        else{

            showTarget();

        }

    }
    else{

        wrong++;

        document.getElementById(
            "message"
        ).textContent=
            `❌ Sai rồi — cần bấm ${target}`;

    }


    updateStats();

}


/* =====================================================
   THỐNG KÊ
===================================================== */

function updateStats(){

    const total=
        currentSong
        ? currentSong.notes.length
        : 0;


    const progress=
        total
        ? Math.round(
            currentIndex/
            total*
            100
        )
        : 0;


    const score=
        correct*10-
        wrong*2;


    document.getElementById(
        "correct"
    ).textContent=
        correct;


    document.getElementById(
        "wrong"
    ).textContent=
        wrong;


    document.getElementById(
        "progress"
    ).textContent=
        progress+"%";


    document.getElementById(
        "score"
    ).textContent=
        Math.max(0,score);

}


/* =====================================================
   BẮT ĐẦU TẬP
===================================================== */

document.getElementById(

    "click",
    ()=>{

        loadSong();

        training=true;

        document.getElementById(
            "message"
        ).textContent=
            "🎯 Bắt đầu! Hãy bấm nốt đang sáng.";

        showTarget();

    }
);

===================================================== */

        training=false;

        let i=0;


        function next(){

                i>=
                currentSong.notes.length
            ){

                document.getElementById(
                    "message"
                ).textContent=
                    "🤖 Demo hoàn thành.";

                showTarget();

                return;

            }


            const note=
                currentSong.notes[i];


            document.getElementById(
                "nextNote"
            ).textContent=
                `🤖 ${note}`;


            playNote(
                note,
                .42
            );


            i++;


            demoTimer=
                setTimeout(
                    next,
                    470
                );

        }


        document.getElementById(
            "message"
        ).textContent=
            "🤖 Đang phát demo...";


        next();

    }
);


/* =====================================================
   BÀN PHÍM MÁY TÍNH
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(event.repeat)return;

        const key=
            event.key.toLowerCase();

        const index=
            keyboard.indexOf(key);

        if(index===-1)return;

        pressNote(
            notes[index]
        );

    }
);


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

loadSong();

</script>
