<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🎹 Piano Trainer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#312e81);
    color:white;
    padding:20px;
}

.app{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:40px;
    margin:10px 0 5px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:25px;
}

.box{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

select{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    margin:10px 6px 0 0;
    background:#6366f1;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
}

#nextNote{
    text-align:center;
    font-size:55px;
    font-weight:bold;
    margin:5px;
}

#message{
    text-align:center;
    min-height:30px;
    font-size:18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    background:rgba(0,0,0,.2);
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:30px;
    margin-top:5px;
}

#guide{
    line-height:1.7;
    color:#dbeafe;
}

.steps{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.step{
    background:#1e293b;
    padding:8px 12px;
    border-radius:8px;
}

.step.current{
    background:#22c55e;
    color:#052e16;
    font-weight:bold;
}

.step.done{
    opacity:.4;
}

.piano{
    display:flex;
    justify-content:center;
    gap:4px;
    overflow-x:auto;
    padding:20px 5px;
}

.key{
    min-width:90px;
    height:250px;
    background:white;
    color:#111;
    border:2px solid #475569;
    border-radius:0 0 12px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:18px;
    cursor:pointer;
    user-select:none;
    transition:.08s;
}

.key:hover{
    background:#e2e8f0;
}

.key.active{
    background:#818cf8;
    transform:translateY(6px);
}

.key.target{
    box-shadow:inset 0 -18px 0 #22c55e;
}

.key .note{
    font-size:20px;
    font-weight:bold;
}

.key .computer{
    margin-top:8px;
    font-size:25px;
    font-weight:bold;
}

.keyboard-info{
    text-align:center;
    font-size:18px;
    color:#cbd5e1;
}

@media(max-width:700px){

    .key{
        min-width:65px;
        height:200px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="subtitle">
Tự học piano bằng bàn phím máy tính
</div>

        document.createElement("div");

    div.className="key";

    div.dataset.note=
        notes[index];

        key;

        }
    );

/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;

function getAudio(){

    if(!audioContext){

        audioContext=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }

    return audioContext;
}


function playNote(
    note,
    duration=.45
){

    const frequency=
        frequencies[note];

    if(!frequency)return;

    const ctx=getAudio();

    const oscillator=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    oscillator.type="triangle";

    oscillator.frequency.value=
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .3,
        ctx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime+
        duration+
        .05
    );

    flashKey(note);
}


/* =====================================================
   SÁNG PHÍM
===================================================== */

function flashKey(note){

    const key=
        document.querySelector(
            `.key[data-note="${note}"]`
        );

    if(!key)return;

    key.classList.add("active");

    setTimeout(
        ()=>{
            key.classList.remove("active");
        },
        180
    );

}


/* =====================================================
   BIẾN
===================================================== */

let currentSong=null;

let currentIndex=0;

let training=false;

let correct=0;

let wrong=0;

let demoTimer=null;


/* =====================================================
   HIỂN THỊ BÀI
===================================================== */

function loadSong(){

    currentSong=
        songs[
            Number(songSelect.value)
        ];

    currentIndex=0;

    correct=0;

    wrong=0;

    training=false;

    clearTimeout(demoTimer);

    updateStats();

    showGuide();

    showTarget();

}


function showGuide(){

    document.getElementById(
        "guide"
    ).innerHTML=`

        <b>${currentSong.name}</b><br>

        Độ khó:
        ${currentSong.difficulty}<br>

        ${currentSong.guide}<br><br>

        <b>🎹 Cách đánh:</b><br>

        ${currentSong.notes
            .map((n,i)=>`${i+1}. ${n}`)
            .join(" → ")
        }
    `;


    const steps=
        document.getElementById("steps");

    steps.innerHTML="";


    currentSong.notes.forEach(
        (note,index)=>{

            const div=
                document.createElement("div");

            div.className="step";

            div.dataset.index=index;

            div.textContent=
                note;

            steps.appendChild(div);

        }
    );

}


/* =====================================================
   HIỆN NỐT CẦN BẤM
===================================================== */

function showTarget(){

    document
        .querySelectorAll(".key")
        .forEach(
            key=>{
                key.classList.remove(
                    "target"
                );
            }
        );


    document
        .querySelectorAll(".step")
        .forEach(
            step=>{
                step.classList.remove(
                    "current"
                );

                step.classList.remove(
                    "done"
                );
            }
        );


    if(
        !currentSong ||
        currentIndex>=
        currentSong.notes.length
    ){

        document.getElementById(
            "nextNote"
        ).textContent="🎉";

        return;
    }


    const note=
        currentSong.notes[currentIndex];


    document.getElementById(
        "nextNote"
    ).textContent=
        `🎯 ${note}`;


    const key=
        document.querySelector(
            `.key[data-note="${note}"]`
        );


    if(key){
        key.classList.add("target");
    }


    document
        .querySelectorAll(".step")
        .forEach(
            step=>{

                const i=
                    Number(step.dataset.index);

                if(i<currentIndex){
                    step.classList.add(
                        "done"
                    );
                }

                if(i===currentIndex){
                    step.classList.add(
                        "current"
                    );
                }

            }
        );

}


/* =====================================================
   BẤM NỐT
===================================================== */

function pressNote(note){

    playNote(note);


    if(!training){

        document.getElementById(
            "message"
        ).textContent=
            `🎹 Đã bấm ${note}`;

        return;
    }


    const target=
        currentSong.notes[currentIndex];


    if(note===target){

        correct++;

        currentIndex++;


        document.getElementById(
            "message"
        ).textContent=
            "✅ Chính xác!";


        if(
            currentIndex>=
            currentSong.notes.length
        ){

            training=false;

            document.getElementById(
                "nextNote"
            ).textContent=
                "🏆 Hoàn thành!";

            document.getElementById(
                "message"
            ).textContent=
                `🎉 Bạn đã hoàn thành ${currentSong.name}!`;

            document
                .querySelectorAll(".key")
                .forEach(
                    key=>{
                        key.classList.remove(
                            "target"
                        );
                    }
                );

        }
        else{

            showTarget();

        }

    }
    else{

        wrong++;

        document.getElementById(
            "message"
        ).textContent=
            `❌ Sai! Cần bấm ${target}`;

    }


    updateStats();

}


/* =====================================================
   THỐNG KÊ
===================================================== */

function updateStats(){

    const total=
        currentSong
        ? currentSong.notes.length
        : 0;

    const progress=
        total
        ? Math.round(
            currentIndex/
            total*
            100
        )
        : 0;

    const score=
        Math.max(
            0,
            correct*10-wrong*2
        );


    document.getElementById(
        "correct"
    ).textContent=
        correct;

    document.getElementById(
        "wrong"
    ).textContent=
        wrong;

    document.getElementById(
        "progress"
    ).textContent=
        progress+"%";

    document.getElementById(
        "score"
    ).textContent=
        score;

}

   BẮT ĐẦU

===================================================== */

        loadSong();

        training=false;

        clearTimeout(demoTimer);

        let index=0;


        document.getElementById(
            "message"
        ).textContent=
            "🤖 Đang chạy demo...";


        function demoNext(){

            if(
                index>=
                currentSong.notes.length
            ){

                document.getElementById(
                    "message"
                ).textContent=
                    "🤖 Demo xong!";

                showTarget();

                return;
            }


            const note=
                currentSong.notes[index];


            document.getElementById(
                "nextNote"
            ).textContent=
                `🤖 ${note}`;


            playNote(
                note,
                .4
            );


            index++;


            demoTimer=
                setTimeout(
                    demoNext,
                    470
                );

        }


        demoNext();

    }
);


/* =====================================================
   BÀN PHÍM MÁY TÍNH
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(event.repeat)return;

        const key=
            event.key.toLowerCase();

        const index=
            keyboard.indexOf(key);

        if(index===-1)return;

        pressNote(
            notes[index]
        );

    }
);


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

loadSong();

</script>
